[project]
name = "fibonacci-kata-lj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ls", email = "leonore.jamet@centrale.centralelille.fr" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fibonacci-kata-lj = "fibonacci_kata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_kata"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "marimo>=0.10",
    "mypy>=2.4.0",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pyflakes, pycodestyle, isort, pyupgrade, bugbear
 

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the
# cell displays — that pattern is exactly what flake8-bugbear's B018
# ("useless expression") flags, so it's disabled for notebook files.
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90
