[project]
name = "fibonacci-kata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ls", email = "leonore.jamet@centrale.centralelille.fr" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fibonacci-kata = "fibonacci_kata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_kata"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "marimo>=0.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

